[package]
name = "silkjs-jit-shell"
version = "0.1.0"
# The JIT-enabled engine executable: qjs plus modules/jit (docs/jit/compiled-entry.md).
# The engine's own executable never links modules/jit.
silk-version = "0.1.0-dev.88+17d1a1b4d501"

[dependencies]
silkjs = { path = "../../engine", package = "silkjs-engine" }
jit = { path = "..", package = "silkjs-jit" }
