[package]
name = "silkjs-runtime-nghttp2"
description = "HTTP/2 for the SilkJS runtime, over nghttp2: the real implementation of its Http2 capability"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"
kind = "library"
# `nghttp2` is Nghttp2.
exports = ["nghttp2"]

[dependencies]
silkjs = { path = "../../engine", package = "silkjs-engine" }
silkjsruntime = { path = "..", package = "silkjs-runtime" }
# nghttp2, compiled into a program only when it depends on this package.
nghttp2native = { path = "../../native/nghttp2", package = "silkjs-nghttp2" }
