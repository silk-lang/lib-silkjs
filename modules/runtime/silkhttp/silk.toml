[package]
name = "silkjs-runtime-silkhttp"
description = "The HTTP/1 parser of the SilkJS runtime in Silk, with no C library: an implementation of its Http capability"
version = "0.1.0"
silk-version = "0.1.0-dev.102+15de63450b0b"
kind = "library"
# `silk_http` is SilkHttp; ext.http_* are shared HTTP/1 protocol helpers.
exports = ["silk_http", "ext.http_core", "ext.http_incoming", "ext.http_outgoing", "ext.http_agent"]

[dependencies]
silkjs = { path = "../../engine", package = "silkjs-engine" }
silkjsruntime = { path = "..", package = "silkjs-runtime" }
