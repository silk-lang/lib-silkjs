[package]
name = "silkjs-silk"
description = "The silkjs executable with the Silk implementations of compression, HTTP/1, HTTP/2, crypto and TLS"
version = "0.1.0"
silk-version = "0.1.0-dev.87+37fa5f8857de"

[dependencies]
cli = { path = "..", package = "silkjs-runtime-cli" }
silkcompress = { path = "../../silkcompress", package = "silkjs-runtime-silkcompress" }
silkhttp = { path = "../../silkhttp", package = "silkjs-runtime-silkhttp" }
silkhttp2 = { path = "../../silkhttp2", package = "silkjs-runtime-silkhttp2" }
silkcrypto = { path = "../../silkcrypto", package = "silkjs-runtime-silkcrypto" }
silktls = { path = "../../silktls", package = "silkjs-runtime-silktls" }
