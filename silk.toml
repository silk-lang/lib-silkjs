# The engine, the runtime and the package manager are released together and build with one Silk toolchain.
# Each member pins it in its own [package].silk-version (Silk refuses a member pin beside a workspace pin), and
# CI installs the one modules/engine/silk.toml names, so a move changes every member's pin.
[workspace]
members = ["modules/engine", "modules/runtime", "modules/runtime/wamr", "modules/runtime/cli", "modules/runtime/cli/silkjs",
  "modules/runtime/cli/silk", "modules/runtime/smoke", "modules/runtime/smoke-wamr", "modules/pm", "modules/runtime/tools/capabilities", "modules/engine/bench/react/driver",
  "modules/jit", "modules/jit/shell", "modules/jit/embed-smoke"]
