name: Embedding
# The composable runtime's matrix (modules/runtime/docs/composable-runtime.md, step 7): the same
# embedding host built twice, once from the core alone (every optional capability empty, no file
# system) and once with every capability's package (WAMR, compression, HTTP/2, HTTP/1, SQLite,
# OpenSSL, the inspector, amaro, and files in memory). Each must print what the test expects, and
# nm must find each capability's library only in the program that depends on its package.
on:
  push:
    # The composable-runtime branches run it on push too, so the matrix runs before a pull request.
    branches: [main, 'claude/composable-runtime-*']
  pull_request:
    paths:
      - 'modules/runtime/**'
      - 'modules/native/**'
      - 'modules/engine/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: embedding-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang 22
        run: |
          test -x /usr/bin/clang-22 || (sudo apt-get update && sudo apt-get install -y clang-22 lld-22)
          echo "SILK_CLANG=/usr/bin/clang-22" >> "$GITHUB_ENV"
      - name: Install the pinned Silk
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export SILK_RELEASE="v$(sed -n 's/^silk-version = "\(.*\)"/\1/p' silk.toml)"
          curl --fail --location https://raw.githubusercontent.com/silk-lang/silk/37fa5f8857de8a068942029e235778a75fe4adf3/install.sh --output "$RUNNER_TEMP/install-silk.sh"
          sh "$RUNNER_TEMP/install-silk.sh"
          echo "$HOME/.silk/bin" >> "$GITHUB_PATH"
      - name: Build and run both embedding programs
        working-directory: modules/runtime
        run: python3 tests/embed-smoke.py
      - name: The program of the core alone links no capability library
        working-directory: modules/runtime/tools/capabilities
        run: |
          # libuv's C API (uv_loop_init) comes only with Node-API (./napi), never with the core.
          # zlib and Zstandard are Silk in ./compress: its jobs' entry stands for them.
          for prefix in wasm_runtime_ uv_loop_init BrotliEncoder silkCompressionWork nghttp2_ llhttp_ sqlite3_ SSL_CTX_ silk_inspector_ silk_type_stripping_sources_linked napi_create_object; do
            silk task symbols --binary ../../build/embed-smoke/embed-smoke --prefix "$prefix" --absent
            silk task symbols --binary ../../build/embed-smoke-wamr/embed-smoke-wamr --prefix "$prefix"
          done
  silk-libraries:
    # Step 8's swaps: the executable with SilkCompression (over silk.compress), SilkHttp,
    # SilkHttp2, SilkCrypto and SilkTls (HTTP/1, HTTP/2, crypto and TLS in Silk, no C library) in
    # place of NativeCompression, Llhttp, Nghttp2, OpenSslCrypto and OpenSslTls
    # (cli/silk) must behave as Node, llhttp and nghttp2 do.
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Clang 22
        run: |
          test -x /usr/bin/clang-22 || (sudo apt-get update && sudo apt-get install -y clang-22 lld-22)
          echo "SILK_CLANG=/usr/bin/clang-22" >> "$GITHUB_ENV"
      - name: Install the pinned Silk
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export SILK_RELEASE="v$(sed -n 's/^silk-version = "\(.*\)"/\1/p' silk.toml)"
          curl --fail --location https://raw.githubusercontent.com/silk-lang/silk/37fa5f8857de8a068942029e235778a75fe4adf3/install.sh --output "$RUNNER_TEMP/install-silk.sh"
          sh "$RUNNER_TEMP/install-silk.sh"
          echo "$HOME/.silk/bin" >> "$GITHUB_PATH"
      - name: Build the executable with the Silk libraries
        working-directory: modules/runtime/cli/silk
        run: |
          mkdir -p ../../build/silk
          SILKJS_CLANG_BUILD=../../build/silk silk build --debug true --clang ../../tools/clang.py
          cp "$(python3 ../../tools/built.py silkjs-silk)" ../../build/silk/silkjs
      - name: Build the executable with the C libraries (the parser differential's reference)
        working-directory: modules/runtime/cli/silkjs
        run: |
          mkdir -p ../../build/native
          SILKJS_CLANG_BUILD=../../build/native silk build --debug true --clang ../../tools/clang.py
          cp "$(python3 ../../tools/built.py silkjs)" ../../build/native/silkjs
      - name: Compression differential against Node
        working-directory: modules/runtime
        run: node tests/compression-differential.mjs build/silk/silkjs
      - name: Crypto differential against Node
        working-directory: modules/runtime
        run: node tests/crypto-differential.mjs build/silk/silkjs
      - name: HTTP/1 parser differential against llhttp
        working-directory: modules/runtime
        run: node tests/http-parser-differential.mjs build/silk/silkjs build/native/silkjs
      - name: Node's HTTP/2 tests with SilkHttp2 and with nghttp2
        working-directory: modules/runtime/tests/node-suite
        run: |
          mkdir -p "$HOME/setup/node-src" && cd "$HOME/setup/node-src" && git init -q
          git remote add origin https://github.com/nodejs/node
          git config core.sparseCheckout true && printf 'test/\n' > .git/info/sparse-checkout
          git fetch -q --depth 1 origin tag v24.22.1 && git checkout -q FETCH_HEAD
          cd "$GITHUB_WORKSPACE/modules/runtime/tests/node-suite"
          # A test that fails only under parallel load gets a second, lone run (run.py's RETRY).
          RETRY=1 python3 run.py "$GITHUB_WORKSPACE/modules/runtime/build/native/silkjs" native.json parallel 4 '^test-http2-'
          RETRY=1 python3 run.py "$GITHUB_WORKSPACE/modules/runtime/build/silk/silkjs" silk.json parallel 4 '^test-http2-'
          # Every test that passes with nghttp2 must pass with SilkHttp2.
          python3 report.py native.json silk.json fails.json | tee report.txt
          grep -q '^eligible [0-9]* pass [0-9]* fail 0 ' report.txt
      - name: Node's TLS and HTTPS tests with SilkTls
        working-directory: modules/runtime/tests/node-suite
        run: |
          RETRY=1 python3 run.py "$(command -v node)" tls-node.json parallel 4 '^test-(tls|https)-'
          RETRY=1 python3 run.py "$GITHUB_WORKSPACE/modules/runtime/build/silk/silkjs" tls-silk.json parallel 4 '^test-(tls|https)-'
          python3 report.py tls-node.json tls-silk.json tls-fails.json | tee tls-report.txt
          # No fewer than docs/composable-runtime.md reports (231 of 283), less a margin for the
          # machine's environment.
          awk '/^eligible/ { exit !($4 >= 225) }' tls-report.txt
      - name: Node compatibility with the Silk libraries
        working-directory: modules/runtime
        env:
          SILKJS_RUNTIME: build/silk/silkjs
        # Less the zlib and Zstandard matrices, which check that main's Silk ports of zlib and zstd
        # (NativeCompression) reproduce those libraries' bytes: SilkCompression's codecs are
        # silk.compress's, which round-trip with them but compress differently. The release builds
        # of macos-runtime.yml and linux-arm64-runtime.yml run them against the executable.
        run: node tests/compat.mjs '^(?!zlib-(behaviour|compressed-bytes|fuzz)|zstd-(levels|parameters|streams|decoding|dictionaries|workers))'
