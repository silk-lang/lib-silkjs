name: Capability graph
# The composable runtime's guard (modules/runtime/docs/composable-runtime.md): a built-in that
# requires, or calls a native of, another service without a declared need fails here, until the
# edge is resolved or listed in docs/capability-crossings.txt. The task reads sources only; the
# runtime is not built.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'modules/runtime/ext/**'
      - 'modules/runtime/libs/**'
      - 'modules/runtime/runtime/**'
      - 'modules/runtime/src/**'
      - 'modules/runtime/tools/capabilities*/**'
      - 'modules/runtime/tools/capabilities.toml'
      - 'modules/runtime/docs/capability-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang 22
        run: |
          test -x /usr/bin/clang-22 || (sudo apt-get update && sudo apt-get install -y clang-22 lld-22)
          echo "SILK_CLANG=/usr/bin/clang-22" >> "$GITHUB_ENV"
      - name: Install the pinned Silk
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export SILK_RELEASE="v$(sed -n 's/^silk-version = "\(.*\)"/\1/p' silk.toml)"
          curl --fail --location https://raw.githubusercontent.com/silk-lang/silk/37fa5f8857de8a068942029e235778a75fe4adf3/install.sh --output "$RUNNER_TEMP/install-silk.sh"
          sh "$RUNNER_TEMP/install-silk.sh"
          echo "$HOME/.silk/bin" >> "$GITHUB_PATH"
      - name: Check the capability graph
        working-directory: modules/runtime/tools/capabilities
        run: silk task graph --check
