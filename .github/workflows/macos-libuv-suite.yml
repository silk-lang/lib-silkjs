name: macOS libuv suite
# libuv's own test suite on an Apple Silicon runner, real libuv against the runtime's Silk
# exports (tools/libuv_suite.py). It builds no runtime, so it answers in minutes.
on:
  push:
    branches: [feature/replace-libuv]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-libuv-suite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  libuv-suite:
    # libuv's own tests against the Silk exports alone: no runtime build, so a quick check.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the pinned Silk and its Clang
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export SILK_RELEASE="v$(sed -n 's/^silk-version = "\(.*\)"/\1/p' silk.toml)"
          curl --fail --location https://raw.githubusercontent.com/silk-lang/silk/8214c402307b/install.sh --output "$RUNNER_TEMP/install-silk.sh"
          sh "$RUNNER_TEMP/install-silk.sh"
          echo "$HOME/.silk/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/sl"
          curl --fail --location https://github.com/silk-lang/silk/releases/download/llvm-23.1.5-silk.1/silk-llvm-23.1.5-silk.1-aarch64-apple-darwin.tar.gz | tar xz -C "$RUNNER_TEMP/sl" --strip-components 1
          cd "$RUNNER_TEMP/sl/bin" && for n in clang clang++ ld.lld lld ld64.lld llvm-ar llvm-nm; do test -e $n || ln -sf llvm $n; done
          echo "SILK_CLANG=$RUNNER_TEMP/sl/bin/clang" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/sl/bin" >> "$GITHUB_PATH"
      - name: The loop driven directly (tests/loop-harness)
        working-directory: modules/runtime
        run: python3 tools/loop_harness.py --work "$RUNNER_TEMP/loop-harness"
      - name: libuv's own test suite, real libuv against the Silk exports
        working-directory: modules/runtime
        run: |
          curl --fail --location https://dist.libuv.org/dist/v1.51.0/libuv-v1.51.0.tar.gz | tar xz -C "$RUNNER_TEMP"
          set +e
          python3 tools/libuv_suite.py --libuv-src "$RUNNER_TEMP/libuv-v1.51.0" --work "$RUNNER_TEMP/uvsuite" --diagnostic tools/libuv_diagnostic.c > "$RUNNER_TEMP/libuv-suite.log" 2>&1; s=$?
          grep -v '^\[ *[0-9]*%\]' "$RUNNER_TEMP/libuv-suite.log" | tail -400
          exit $s
